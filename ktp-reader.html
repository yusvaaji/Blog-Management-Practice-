<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTP Reader - Ekstraksi Data KTP</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            padding: 40px;
        }

        .upload-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border: 2px dashed #dee2e6;
            transition: all 0.3s ease;
        }

        .upload-section:hover {
            border-color: #4facfe;
            background: #f0f8ff;
        }

        .upload-area {
            text-align: center;
            padding: 40px;
        }

        .upload-icon {
            font-size: 4em;
            color: #4facfe;
            margin-bottom: 20px;
        }

        .file-input {
            display: none;
        }

        .upload-btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 172, 254, 0.3);
        }

        .preview-section {
            display: none;
            margin-top: 30px;
        }

        .preview-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 20px;
        }

        .image-preview {
            text-align: center;
        }

        .image-preview img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .extracted-data {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
        }

        .data-field {
            margin-bottom: 15px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #4facfe;
            transition: all 0.3s ease;
        }

        .data-field.found {
            border-left-color: #28a745;
            background: #f8fff9;
        }

        .data-field.missing {
            border-left-color: #dc3545;
            background: #fff8f8;
        }

        .data-field.not-found {
            border-left-color: #ffc107;
            background: #fffef8;
        }

        .data-label {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .data-value {
            color: #666;
            font-size: 0.95em;
        }

        .required {
            color: #dc3545;
            font-weight: bold;
        }

        .extraction-summary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .extraction-summary h4 {
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .stat {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .stat-value {
            font-weight: bold;
            font-size: 1.1em;
        }

        .stat-value.good {
            color: #28a745;
        }

        .stat-value.medium {
            color: #ffc107;
        }

        .stat-value.poor {
            color: #dc3545;
        }

        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4facfe;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            display: none;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            display: none;
        }

        .raw-text {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 0.9em;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }

        .toggle-raw {
            background: #6c757d;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .preview-container {
                grid-template-columns: 1fr;
            }
            
            .main-content {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📄 KTP Reader</h1>
            <p>Ekstraksi Data Otomatis dari Gambar KTP Indonesia</p>
        </div>

        <div class="main-content">
            <div class="upload-section">
                <div class="upload-area">
                    <div class="upload-icon">📷</div>
                    <h3>Upload Gambar KTP</h3>
                    <p>Pilih file gambar KTP untuk diekstrak datanya</p>
                    <input type="file" id="fileInput" class="file-input" accept="image/*">
                    <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                        Pilih File
                    </button>
                    <button class="upload-btn" onclick="startCamera()">
                        Ambil Foto
                    </button>
                </div>
            </div>

            <div class="error" id="errorMessage"></div>
            <div class="success" id="successMessage"></div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Sedang memproses gambar KTP...</p>
                <p><small>Ini mungkin memakan waktu beberapa detik</small></p>
            </div>

            <div class="preview-section" id="previewSection">
                <h3>Hasil Ekstraksi Data</h3>
                <div class="preview-container">
                    <div class="image-preview">
                        <img id="previewImage" alt="Preview KTP">
                    </div>
                    <div class="extracted-data" id="extractedData">
                        <!-- Data akan diisi oleh JavaScript -->
                    </div>
                </div>
                
                <div class="raw-text" id="rawText">
                    <h4>Raw OCR Text:</h4>
                    <div id="rawTextContent"></div>
                </div>
                <button class="toggle-raw" onclick="toggleRawText()">Tampilkan/Sembunyikan Raw Text</button>
            </div>
        </div>
    </div>

    <script>
        let worker = null;
        let rawOcrText = '';

        // Initialize Tesseract worker
        async function initWorker() {
            if (!worker) {
                worker = await Tesseract.createWorker('ind', 1, {
                    logger: m => console.log(m)
                });
            }
            return worker;
        }

        // File input handler
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                processImage(file);
            }
        });

        // Camera capture function
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: 'environment' // Use back camera if available
                    } 
                });
                
                // Create a simple camera interface
                const video = document.createElement('video');
                video.srcObject = stream;
                video.style.width = '100%';
                video.style.maxHeight = '400px';
                video.play();

                const cameraContainer = document.createElement('div');
                cameraContainer.style.textAlign = 'center';
                cameraContainer.style.margin = '20px 0';
                
                const captureBtn = document.createElement('button');
                captureBtn.textContent = 'Ambil Foto';
                captureBtn.className = 'upload-btn';
                captureBtn.style.margin = '10px';
                
                const cancelBtn = document.createElement('button');
                cancelBtn.textContent = 'Batal';
                cancelBtn.className = 'upload-btn';
                cancelBtn.style.backgroundColor = '#dc3545';
                cancelBtn.style.margin = '10px';

                cameraContainer.appendChild(video);
                cameraContainer.appendChild(captureBtn);
                cameraContainer.appendChild(cancelBtn);

                // Replace upload area temporarily
                const uploadArea = document.querySelector('.upload-area');
                const originalContent = uploadArea.innerHTML;
                uploadArea.innerHTML = '';
                uploadArea.appendChild(cameraContainer);

                captureBtn.onclick = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0);
                    
                    canvas.toBlob((blob) => {
                        stream.getTracks().forEach(track => track.stop());
                        uploadArea.innerHTML = originalContent;
                        processImage(blob);
                    });
                };

                cancelBtn.onclick = () => {
                    stream.getTracks().forEach(track => track.stop());
                    uploadArea.innerHTML = originalContent;
                };

            } catch (error) {
                showError('Tidak dapat mengakses kamera: ' + error.message);
            }
        }

        // Process image with OCR and image preprocessing
        async function processImage(file) {
            try {
                showLoading(true);
                hideMessages();

                // Show preview
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('previewImage').src = e.target.result;
                    document.getElementById('previewSection').style.display = 'block';
                };
                reader.readAsDataURL(file);

                // Initialize worker
                const worker = await initWorker();

                // Try multiple OCR attempts with different settings
                let bestResult = { text: '', confidence: 0 };
                
                // First attempt: Default settings
                const result1 = await worker.recognize(file);
                if (result1.data.confidence > bestResult.confidence) {
                    bestResult = result1.data;
                }

                // Second attempt: With image preprocessing
                const processedImage = await preprocessImage(file);
                const result2 = await worker.recognize(processedImage);
                if (result2.data.confidence > bestResult.confidence) {
                    bestResult = result2.data;
                }

                // Third attempt: Different OCR settings
                await worker.setParameters({
                    tessedit_char_whitelist: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz :,.-/',
                    tessedit_pageseg_mode: '6' // Single uniform block of text
                });
                
                const result3 = await worker.recognize(file);
                if (result3.data.confidence > bestResult.confidence) {
                    bestResult = result3.data;
                }

                rawOcrText = bestResult.text;
                
                // Extract KTP data
                const ktpData = extractKTPData(bestResult.text);
                
                // Display results
                displayExtractedData(ktpData);
                document.getElementById('rawTextContent').textContent = bestResult.text;
                
                showSuccess(`Data KTP berhasil diekstrak! (Confidence: ${Math.round(bestResult.confidence)}%)`);
                showLoading(false);

            } catch (error) {
                console.error('Error processing image:', error);
                showError('Terjadi kesalahan saat memproses gambar: ' + error.message);
                showLoading(false);
            }
        }

        // Image preprocessing for better OCR accuracy
        async function preprocessImage(file) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // Set canvas size
                    canvas.width = img.width;
                    canvas.height = img.height;
                    
                    // Draw image
                    ctx.drawImage(img, 0, 0);
                    
                    // Get image data
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageData.data;
                    
                    // Apply preprocessing
                    for (let i = 0; i < data.length; i += 4) {
                        // Convert to grayscale
                        const gray = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
                        
                        // Apply threshold (make text darker, background lighter)
                        const threshold = 128;
                        const newValue = gray > threshold ? 255 : 0;
                        
                        data[i] = newValue;     // Red
                        data[i + 1] = newValue; // Green
                        data[i + 2] = newValue; // Blue
                        // Alpha channel remains unchanged
                    }
                    
                    // Put processed data back
                    ctx.putImageData(imageData, 0, 0);
                    
                    // Convert to blob
                    canvas.toBlob((blob) => {
                        resolve(blob);
                    }, 'image/png');
                };
                
                img.src = URL.createObjectURL(file);
            });
        }

        // Enhanced KTP data extraction with better accuracy
        function extractKTPData(text) {
            const data = {};
            const lines = text.split('\n').map(line => line.trim()).filter(line => line.length > 0);
            
            // Clean text for better matching
            const cleanText = text.replace(/[^\w\s\d:,-]/g, ' ').replace(/\s+/g, ' ');

            // Enhanced NIK extraction with multiple patterns
            const nikPatterns = [
                /(?:NIK|N\.I\.K)[\s:]*(\d{16})/i,
                /NIK[\s:]*(\d{16})/i,
                /(\d{16})/g, // Find any 16-digit number
                /(\d{3}\.\d{3}\.\d{3}\.\d{3}\.\d{4})/g, // NIK with dots
                /(\d{3}\s\d{3}\s\d{3}\s\d{3}\s\d{4})/g // NIK with spaces
            ];

            for (const pattern of nikPatterns) {
                const matches = cleanText.match(pattern);
                if (matches) {
                    // Take the first valid 16-digit NIK
                    for (const match of matches) {
                        const nik = match.replace(/[^\d]/g, '');
                        if (nik.length === 16 && isValidNIK(nik)) {
                            data.nik = nik;
                            break;
                        }
                    }
                    if (data.nik) break;
                }
            }

            // Enhanced name extraction
            const namePatterns = [
                /(?:Nama|NAMA)[\s:]*([A-Z][A-Z\s]{2,30})/i,
                /(?:Nama Lengkap|NAMA LENGKAP)[\s:]*([A-Z][A-Z\s]{2,30})/i
            ];

            for (const pattern of namePatterns) {
                const match = cleanText.match(pattern);
                if (match) {
                    const name = match[1].trim();
                    if (isValidName(name)) {
                        data.nama = name;
                        break;
                    }
                }
            }

            // If no name found with patterns, try to find it manually
            if (!data.nama) {
                const nameCandidates = lines.filter(line => {
                    return line.length >= 3 && 
                           line.length <= 50 && 
                           /^[A-Z\s]+$/.test(line) &&
                           !line.includes('PROVINSI') &&
                           !line.includes('KABUPATEN') &&
                           !line.includes('KOTA') &&
                           !line.includes('REPUBLIK') &&
                           !line.includes('INDONESIA') &&
                           !line.includes('KARTU') &&
                           !line.includes('TANDA') &&
                           !line.includes('PENDUDUK') &&
                           !isNumericOnly(line);
                });

                // Take the most likely name (usually the longest valid name)
                if (nameCandidates.length > 0) {
                    data.nama = nameCandidates.reduce((longest, current) => 
                        current.length > longest.length ? current : longest
                    );
                }
            }

            // Enhanced field extraction with better patterns
            const patterns = {
                tempatLahir: [
                    /(?:Tempat\/Tgl Lahir|Tempat Lahir)[\s:]*([A-Z][A-Z\s]+),\s*(\d{1,2}-\d{1,2}-\d{4})/i,
                    /(?:Tempat\/Tgl Lahir|Tempat Lahir)[\s:]*([A-Z][A-Z\s]+),\s*(\d{1,2}\/\d{1,2}\/\d{4})/i,
                    /(?:Tempat\/Tgl Lahir|Tempat Lahir)[\s:]*([A-Z][A-Z\s]+),\s*(\d{1,2}\s\w+\s\d{4})/i
                ],
                jenisKelamin: [
                    /(?:Jenis Kelamin|JK)[\s:]*([A-Z]+)/i,
                    /(?:Jenis Kelamin|JK)[\s:]*([A-Z][A-Z]+)/i
                ],
                alamat: [
                    /(?:Alamat|ALAMAT)[\s:]*([A-Z0-9\s,.-]{10,})/i,
                    /(?:Alamat|ALAMAT)[\s:]*([A-Z0-9\s,.-]+)/i
                ],
                rtRw: [
                    /(?:RT\/RW|RT\/RW)[\s:]*(\d{3}\/\d{3})/i,
                    /(?:RT\/RW|RT\/RW)[\s:]*(\d{2,3}\/\d{2,3})/i
                ],
                kelDesa: [
                    /(?:Kel\/Desa|Kelurahan\/Desa)[\s:]*([A-Z\s]+)/i,
                    /(?:Kel\/Desa|Kelurahan\/Desa)[\s:]*([A-Z][A-Z\s]+)/i
                ],
                kecamatan: [
                    /(?:Kecamatan|KECAMATAN)[\s:]*([A-Z\s]+)/i,
                    /(?:Kecamatan|KECAMATAN)[\s:]*([A-Z][A-Z\s]+)/i
                ],
                agama: [
                    /(?:Agama|AGAMA)[\s:]*([A-Z\s]+)/i,
                    /(?:Agama|AGAMA)[\s:]*([A-Z][A-Z\s]+)/i
                ],
                statusPerkawinan: [
                    /(?:Status Perkawinan|Status Kawin)[\s:]*([A-Z\s]+)/i,
                    /(?:Status Perkawinan|Status Kawin)[\s:]*([A-Z][A-Z\s]+)/i
                ],
                pekerjaan: [
                    /(?:Pekerjaan|PEKERJAAN)[\s:]*([A-Z\s]+)/i,
                    /(?:Pekerjaan|PEKERJAAN)[\s:]*([A-Z][A-Z\s]+)/i
                ],
                kewarganegaraan: [
                    /(?:Kewarganegaraan|WNI|WN)[\s:]*([A-Z\s]+)/i,
                    /(?:Kewarganegaraan|WNI|WN)[\s:]*([A-Z][A-Z\s]+)/i
                ],
                berlakuHingga: [
                    /(?:Berlaku Hingga|Berlaku Sampai)[\s:]*([A-Z0-9\s-]+)/i,
                    /(?:Berlaku Hingga|Berlaku Sampai)[\s:]*([A-Z0-9\s-]+)/i
                ]
            };

            // Extract data using enhanced patterns
            for (const [key, patternArray] of Object.entries(patterns)) {
                for (const pattern of patternArray) {
                    const match = cleanText.match(pattern);
                    if (match) {
                        if (key === 'tempatLahir') {
                            data.tempatLahir = match[1].trim();
                            data.tanggalLahir = match[2].trim();
                        } else {
                            data[key] = match[1].trim();
                        }
                        break; // Use first valid match
                    }
                }
            }

            return data;
        }

        // Validation functions
        function isValidNIK(nik) {
            if (!nik || nik.length !== 16) return false;
            
            // Basic NIK validation (province code should be valid)
            const provinceCode = nik.substring(0, 2);
            const validProvinceCodes = [
                '11', '12', '13', '14', '15', '16', '17', '18', '19', // Sumatra
                '21', '22', '23', '24', '25', '26', '27', '28', '29', // Sumatra
                '31', '32', '33', '34', '35', '36', '37', '38', '39', // Jawa
                '41', '42', '43', '44', '45', '46', '47', '48', '49', // Kalimantan
                '51', '52', '53', '54', '55', '56', '57', '58', '59', // Sulawesi
                '61', '62', '63', '64', '65', '66', '67', '68', '69', // Kalimantan
                '71', '72', '73', '74', '75', '76', '77', '78', '79', // Sulawesi
                '81', '82', '83', '84', '85', '86', '87', '88', '89', // Maluku & Papua
                '91', '92', '93', '94', '95', '96', '97', '98', '99'  // Papua
            ];
            
            return validProvinceCodes.includes(provinceCode);
        }

        function isValidName(name) {
            if (!name || name.length < 3 || name.length > 50) return false;
            
            // Check if name contains only letters and spaces
            if (!/^[A-Z\s]+$/.test(name)) return false;
            
            // Check if name doesn't contain common non-name words
            const invalidWords = [
                'PROVINSI', 'KABUPATEN', 'KOTA', 'REPUBLIK', 'INDONESIA',
                'KARTU', 'TANDA', 'PENDUDUK', 'NIK', 'NAMA', 'ALAMAT',
                'KECAMATAN', 'KELURAHAN', 'DESA', 'RT', 'RW', 'AGAMA',
                'PEKERJAAN', 'STATUS', 'PERKAWINAN', 'KEWARGANEGARAAN'
            ];
            
            return !invalidWords.some(word => name.includes(word));
        }

        function isNumericOnly(str) {
            return /^\d+$/.test(str);
        }

        // Display extracted data with confidence indicators
        function displayExtractedData(data) {
            const container = document.getElementById('extractedData');
            const fields = [
                { key: 'nik', label: 'NIK', required: true },
                { key: 'nama', label: 'Nama Lengkap', required: true },
                { key: 'tempatLahir', label: 'Tempat Lahir', required: false },
                { key: 'tanggalLahir', label: 'Tanggal Lahir', required: false },
                { key: 'jenisKelamin', label: 'Jenis Kelamin', required: false },
                { key: 'alamat', label: 'Alamat', required: false },
                { key: 'rtRw', label: 'RT/RW', required: false },
                { key: 'kelDesa', label: 'Kelurahan/Desa', required: false },
                { key: 'kecamatan', label: 'Kecamatan', required: false },
                { key: 'agama', label: 'Agama', required: false },
                { key: 'statusPerkawinan', label: 'Status Perkawinan', required: false },
                { key: 'pekerjaan', label: 'Pekerjaan', required: false },
                { key: 'kewarganegaraan', label: 'Kewarganegaraan', required: false },
                { key: 'berlakuHingga', label: 'Berlaku Hingga', required: false }
            ];

            let html = '';
            let foundCount = 0;
            let requiredFound = 0;

            fields.forEach(field => {
                const value = data[field.key];
                const isFound = value && value !== 'Tidak ditemukan';
                
                if (isFound) {
                    foundCount++;
                    if (field.required) requiredFound++;
                }

                const statusIcon = isFound ? '✅' : (field.required ? '❌' : '⚠️');
                const statusClass = isFound ? 'found' : (field.required ? 'missing' : 'not-found');
                
                html += `
                    <div class="data-field ${statusClass}">
                        <div class="data-label">
                            ${statusIcon} ${field.label}
                            ${field.required ? '<span class="required">*</span>' : ''}
                        </div>
                        <div class="data-value">${value || 'Tidak ditemukan'}</div>
                    </div>
                `;
            });

            // Add summary
            const accuracy = Math.round((foundCount / fields.length) * 100);
            const requiredAccuracy = Math.round((requiredFound / fields.filter(f => f.required).length) * 100);
            
            html = `
                <div class="extraction-summary">
                    <h4>📊 Ringkasan Ekstraksi</h4>
                    <div class="summary-stats">
                        <div class="stat">
                            <span class="stat-label">Akurasi Keseluruhan:</span>
                            <span class="stat-value ${accuracy >= 70 ? 'good' : accuracy >= 50 ? 'medium' : 'poor'}">${accuracy}%</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Data Penting:</span>
                            <span class="stat-value ${requiredAccuracy >= 80 ? 'good' : requiredAccuracy >= 60 ? 'medium' : 'poor'}">${requiredAccuracy}%</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Field Ditemukan:</span>
                            <span class="stat-value">${foundCount}/${fields.length}</span>
                        </div>
                    </div>
                </div>
            ` + html;

            container.innerHTML = html;
        }

        // Utility functions
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
        }

        function hideMessages() {
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
        }

        function toggleRawText() {
            const rawTextDiv = document.getElementById('rawText');
            rawTextDiv.style.display = rawTextDiv.style.display === 'none' ? 'block' : 'none';
        }

        // Cleanup worker on page unload
        window.addEventListener('beforeunload', () => {
            if (worker) {
                worker.terminate();
            }
        });
    </script>
</body>
</html>
