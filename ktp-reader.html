<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTP Reader - Ekstraksi Data KTP</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            padding: 40px;
        }

        .upload-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border: 2px dashed #dee2e6;
            transition: all 0.3s ease;
        }

        .upload-section:hover {
            border-color: #4facfe;
            background: #f0f8ff;
        }

        .upload-area {
            text-align: center;
            padding: 40px;
        }

        .upload-icon {
            font-size: 4em;
            color: #4facfe;
            margin-bottom: 20px;
        }

        .file-input {
            display: none;
        }

        .upload-btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 172, 254, 0.3);
        }

        .preview-section {
            display: none;
            margin-top: 30px;
        }

        .preview-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 20px;
        }

        .image-preview {
            text-align: center;
        }

        .image-preview img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .extracted-data {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
        }

        .data-field {
            margin-bottom: 15px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #4facfe;
        }

        .data-label {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .data-value {
            color: #666;
            font-size: 0.95em;
        }

        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4facfe;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            display: none;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            display: none;
        }

        .raw-text {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 0.9em;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }

        .toggle-raw {
            background: #6c757d;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .preview-container {
                grid-template-columns: 1fr;
            }
            
            .main-content {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📄 KTP Reader</h1>
            <p>Ekstraksi Data Otomatis dari Gambar KTP Indonesia</p>
        </div>

        <div class="main-content">
            <div class="upload-section">
                <div class="upload-area">
                    <div class="upload-icon">📷</div>
                    <h3>Upload Gambar KTP</h3>
                    <p>Pilih file gambar KTP untuk diekstrak datanya</p>
                    <input type="file" id="fileInput" class="file-input" accept="image/*">
                    <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                        Pilih File
                    </button>
                    <button class="upload-btn" onclick="startCamera()">
                        Ambil Foto
                    </button>
                </div>
            </div>

            <div class="error" id="errorMessage"></div>
            <div class="success" id="successMessage"></div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Sedang memproses gambar KTP...</p>
                <p><small>Ini mungkin memakan waktu beberapa detik</small></p>
            </div>

            <div class="preview-section" id="previewSection">
                <h3>Hasil Ekstraksi Data</h3>
                <div class="preview-container">
                    <div class="image-preview">
                        <img id="previewImage" alt="Preview KTP">
                    </div>
                    <div class="extracted-data" id="extractedData">
                        <!-- Data akan diisi oleh JavaScript -->
                    </div>
                </div>
                
                <div class="raw-text" id="rawText">
                    <h4>Raw OCR Text:</h4>
                    <div id="rawTextContent"></div>
                </div>
                <button class="toggle-raw" onclick="toggleRawText()">Tampilkan/Sembunyikan Raw Text</button>
            </div>
        </div>
    </div>

    <script>
        let worker = null;
        let rawOcrText = '';

        // Initialize Tesseract worker
        async function initWorker() {
            if (!worker) {
                worker = await Tesseract.createWorker('ind', 1, {
                    logger: m => console.log(m)
                });
            }
            return worker;
        }

        // File input handler
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                processImage(file);
            }
        });

        // Camera capture function
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: 'environment' // Use back camera if available
                    } 
                });
                
                // Create a simple camera interface
                const video = document.createElement('video');
                video.srcObject = stream;
                video.style.width = '100%';
                video.style.maxHeight = '400px';
                video.play();

                const cameraContainer = document.createElement('div');
                cameraContainer.style.textAlign = 'center';
                cameraContainer.style.margin = '20px 0';
                
                const captureBtn = document.createElement('button');
                captureBtn.textContent = 'Ambil Foto';
                captureBtn.className = 'upload-btn';
                captureBtn.style.margin = '10px';
                
                const cancelBtn = document.createElement('button');
                cancelBtn.textContent = 'Batal';
                cancelBtn.className = 'upload-btn';
                cancelBtn.style.backgroundColor = '#dc3545';
                cancelBtn.style.margin = '10px';

                cameraContainer.appendChild(video);
                cameraContainer.appendChild(captureBtn);
                cameraContainer.appendChild(cancelBtn);

                // Replace upload area temporarily
                const uploadArea = document.querySelector('.upload-area');
                const originalContent = uploadArea.innerHTML;
                uploadArea.innerHTML = '';
                uploadArea.appendChild(cameraContainer);

                captureBtn.onclick = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0);
                    
                    canvas.toBlob((blob) => {
                        stream.getTracks().forEach(track => track.stop());
                        uploadArea.innerHTML = originalContent;
                        processImage(blob);
                    });
                };

                cancelBtn.onclick = () => {
                    stream.getTracks().forEach(track => track.stop());
                    uploadArea.innerHTML = originalContent;
                };

            } catch (error) {
                showError('Tidak dapat mengakses kamera: ' + error.message);
            }
        }

        // Process image with OCR
        async function processImage(file) {
            try {
                showLoading(true);
                hideMessages();

                // Show preview
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('previewImage').src = e.target.result;
                    document.getElementById('previewSection').style.display = 'block';
                };
                reader.readAsDataURL(file);

                // Initialize worker
                const worker = await initWorker();

                // Perform OCR
                const { data: { text } } = await worker.recognize(file);
                rawOcrText = text;
                
                // Extract KTP data
                const ktpData = extractKTPData(text);
                
                // Display results
                displayExtractedData(ktpData);
                document.getElementById('rawTextContent').textContent = text;
                
                showSuccess('Data KTP berhasil diekstrak!');
                showLoading(false);

            } catch (error) {
                console.error('Error processing image:', error);
                showError('Terjadi kesalahan saat memproses gambar: ' + error.message);
                showLoading(false);
            }
        }

        // Extract KTP data from OCR text
        function extractKTPData(text) {
            const data = {};
            const lines = text.split('\n').map(line => line.trim()).filter(line => line.length > 0);

            // Common KTP field patterns
            const patterns = {
                nik: /(?:NIK|N\.I\.K)[\s:]*(\d{16})/i,
                nama: /(?:Nama|NAMA)[\s:]*([A-Z\s]+)/i,
                tempatLahir: /(?:Tempat\/Tgl Lahir|Tempat Lahir)[\s:]*([A-Z\s]+),\s*(\d{2}-\d{2}-\d{4})/i,
                jenisKelamin: /(?:Jenis Kelamin|JK)[\s:]*([A-Z]+)/i,
                alamat: /(?:Alamat|ALAMAT)[\s:]*([A-Z0-9\s,.-]+)/i,
                rtRw: /(?:RT\/RW|RT\/RW)[\s:]*(\d{3}\/\d{3})/i,
                kelDesa: /(?:Kel\/Desa|Kelurahan\/Desa)[\s:]*([A-Z\s]+)/i,
                kecamatan: /(?:Kecamatan|KECAMATAN)[\s:]*([A-Z\s]+)/i,
                agama: /(?:Agama|AGAMA)[\s:]*([A-Z\s]+)/i,
                statusPerkawinan: /(?:Status Perkawinan|Status Kawin)[\s:]*([A-Z\s]+)/i,
                pekerjaan: /(?:Pekerjaan|PEKERJAAN)[\s:]*([A-Z\s]+)/i,
                kewarganegaraan: /(?:Kewarganegaraan|WNI|WN)[\s:]*([A-Z\s]+)/i,
                berlakuHingga: /(?:Berlaku Hingga|Berlaku Sampai)[\s:]*([A-Z0-9\s-]+)/i
            };

            // Extract data using patterns
            for (const [key, pattern] of Object.entries(patterns)) {
                const match = text.match(pattern);
                if (match) {
                    if (key === 'tempatLahir') {
                        data.tempatLahir = match[1];
                        data.tanggalLahir = match[2];
                    } else {
                        data[key] = match[1];
                    }
                }
            }

            // Additional manual extraction for common fields
            if (!data.nik) {
                const nikMatch = text.match(/\b\d{16}\b/);
                if (nikMatch) data.nik = nikMatch[0];
            }

            if (!data.nama) {
                // Look for name patterns in the first few lines
                const nameMatch = lines.slice(0, 5).find(line => 
                    /^[A-Z\s]{3,}$/.test(line) && 
                    !line.includes('PROVINSI') && 
                    !line.includes('KABUPATEN') &&
                    !line.includes('KOTA')
                );
                if (nameMatch) data.nama = nameMatch;
            }

            return data;
        }

        // Display extracted data
        function displayExtractedData(data) {
            const container = document.getElementById('extractedData');
            const fields = [
                { key: 'nik', label: 'NIK' },
                { key: 'nama', label: 'Nama Lengkap' },
                { key: 'tempatLahir', label: 'Tempat Lahir' },
                { key: 'tanggalLahir', label: 'Tanggal Lahir' },
                { key: 'jenisKelamin', label: 'Jenis Kelamin' },
                { key: 'alamat', label: 'Alamat' },
                { key: 'rtRw', label: 'RT/RW' },
                { key: 'kelDesa', label: 'Kelurahan/Desa' },
                { key: 'kecamatan', label: 'Kecamatan' },
                { key: 'agama', label: 'Agama' },
                { key: 'statusPerkawinan', label: 'Status Perkawinan' },
                { key: 'pekerjaan', label: 'Pekerjaan' },
                { key: 'kewarganegaraan', label: 'Kewarganegaraan' },
                { key: 'berlakuHingga', label: 'Berlaku Hingga' }
            ];

            let html = '';
            fields.forEach(field => {
                const value = data[field.key] || 'Tidak ditemukan';
                html += `
                    <div class="data-field">
                        <div class="data-label">${field.label}</div>
                        <div class="data-value">${value}</div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Utility functions
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
        }

        function hideMessages() {
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
        }

        function toggleRawText() {
            const rawTextDiv = document.getElementById('rawText');
            rawTextDiv.style.display = rawTextDiv.style.display === 'none' ? 'block' : 'none';
        }

        // Cleanup worker on page unload
        window.addEventListener('beforeunload', () => {
            if (worker) {
                worker.terminate();
            }
        });
    </script>
</body>
</html>
